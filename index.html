<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#34c759" />
    <meta name="description" content="Learn English the fun way — bite-sized lessons for Bangla speakers." />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Englio" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Englio</title>
    <script>
      // Apply the theme before anything is drawn: white unless dark or "follow the phone" was picked (src/lib/theme.ts).
      document.documentElement.dataset.theme = 'light';
      try {
        var t = localStorage.getItem('englio-theme');
        if (t === 'dark') document.documentElement.dataset.theme = 'dark';
        if (t === 'auto') delete document.documentElement.dataset.theme;
        // …and the text size (src/lib/textSize.ts).
        var z = localStorage.getItem('englio-text-size');
        if (z === 'large' || z === 'larger') document.documentElement.dataset.textSize = z;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
